<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crew schedule</title>
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css"/>
    <style>
        .schedule { font-size: .85rem; }
        .schedule th, .schedule td { text-align: center; white-space: nowrap; padding: .25rem .4rem; }
        .schedule th.shift { text-align: left; }
        .schedule .weekend { background: #f1f3f5; }
        .crew { display: block; border-radius: .25rem; padding: .1rem .3rem; color: #fff; font-weight: 600; }
    </style>
</head>
<body>
<div class="container-fluid py-3">
    <div class="d-flex flex-wrap align-items-end gap-2 mb-3">
        <h1 class="h4 me-auto mb-0">Crew schedule <small id="month" class="text-muted"></small></h1>
        <label class="form-label mb-0">
            Month
            <input id="dateInput" type="month" class="form-control form-control-sm">
        </label>
        <button id="initButton" class="btn btn-primary btn-sm">Generate</button>
    </div>
    <p class="text-muted small">
        Every crew works Day (08:00–20:00) → Night (20:00–08:00) → two days off.
        Crews are assigned to lines at random on every "Generate".
    </p>
    <div id="error" class="alert alert-danger d-none"></div>
    <div id="lines"></div>
</div>
<script src="app.js"></script>
</body>
</html>
