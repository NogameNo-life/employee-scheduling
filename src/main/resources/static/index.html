<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>График бригад</title>
  <!-- Only local files (webjars): the plant network may have no internet -->
  <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/webjars/font-awesome/css/all.css">
  <link rel="stylesheet" href="/style.css">
</head>

<body>
<div id="notificationPanel" aria-live="polite" aria-atomic="true"></div>

<header class="app-header">
  <div class="title-block">
    <h1 class="app-title">График бригад</h1>
    <div class="chips">
      <button type="button" id="warningChip" class="chip chip-warning">
        <span class="fas fa-exclamation-triangle"></span><span class="text"></span>
      </button>
      <button type="button" id="deficitChip" class="chip chip-deficit">
        <span class="fas fa-user-minus"></span><span class="text"></span>
      </button>
    </div>
  </div>

  <div class="toolbar">
    <fieldset class="segmented" aria-label="Месяц">
      <button type="button" id="prevMonthButton" title="Предыдущий месяц" aria-label="Предыдущий месяц">
        <span class="fas fa-chevron-left"></span>
      </button>
      <span class="month-label"><span class="far fa-calendar me-1"></span><span id="monthLabel"></span></span>
      <button type="button" id="nextMonthButton" title="Следующий месяц" aria-label="Следующий месяц">
        <span class="fas fa-chevron-right"></span>
      </button>
    </fieldset>
    <fieldset class="segmented" aria-label="Вид">
      <button type="button" id="viewLinesButton" class="active">
        <span class="fas fa-th me-1"></span>По линиям
      </button>
      <button type="button" id="viewEmployeesButton">
        <span class="fas fa-users me-1"></span>По сотрудникам
      </button>
    </fieldset>
    <button type="button" id="refreshButton" class="btn btn-outline-dark" title="Обновить" aria-label="Обновить">
      <span class="fas fa-sync-alt"></span>
    </button>
    <button type="button" id="newMonthButton" class="btn btn-outline-dark">
      <span class="fas fa-calendar-plus me-1"></span>Новый пустой месяц
    </button>
    <button type="button" id="generateButton" class="btn btn-dark">
      <span class="fas fa-magic me-1"></span>Авто-заполнение
    </button>
    <!-- A disabled button shows no tooltip, so the wrapper has it -->
    <span class="d-inline-block" title="Сохранение в БД ещё не сделано">
      <button type="button" class="btn btn-success" disabled style="pointer-events: none;">
        <span class="fas fa-save me-1"></span>Сохранить
      </button>
    </span>
  </div>
</header>

<main class="page">
  <section class="panel legend" id="legend" aria-label="Обозначения"></section>

  <div class="workspace">
    <section class="panel grid-panel" aria-label="График">
      <div class="grid-scroll" id="gridScroll"></div>
    </section>

    <aside class="panel drawer" id="drawer" hidden aria-label="Подробности">
      <div class="drawer-header">
        <div class="flex-grow-1" id="drawerHeader"></div>
        <button type="button" class="btn-close" id="drawerClose" aria-label="Закрыть"></button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>
  </div>

  <footer class="stats" id="stats"></footer>
  <p class="text-muted small mt-3 mb-0" id="version"></p>
</main>

<!-- New month (also prev / next month): replaces the version -->
<div class="modal fade" id="newMonthModal" tabindex="-1" aria-labelledby="newMonthModalTitle" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="newMonthModalTitle">Новый месяц</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <label for="newMonthInput" class="form-label">Месяц</label>
        <input id="newMonthInput" type="month" class="form-control mb-2">
        <p class="text-muted small">Ваша текущая версия графика будет заменена новой.</p>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="newMonthGenerate">
          <label class="form-check-label" for="newMonthGenerate">
            Сгенерировать график (День → Ночь → Отсыпной → Выходной для всех линий)
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-dark" id="newMonthModalSave">Начать месяц</button>
      </div>
    </div>
  </div>
</div>

<!-- Generator -->
<div class="modal fade" id="generateModal" tabindex="-1" aria-labelledby="generateModalTitle" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="generateModalTitle">Авто-заполнение графика</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small">
          Линии с 4 бригадами заполняются по циклу День → Ночь → Отсыпной → Выходной до конца месяца.
          Закреплённые смены не меняются.
        </p>
        <label for="generateLine" class="form-label">Линия</label>
        <select id="generateLine" class="form-select mb-2"></select>
        <label for="generateFrom" class="form-label">С даты</label>
        <input id="generateFrom" type="date" class="form-control mb-2">
        <label for="generateStartCrew" class="form-label">Бригада в дневную смену первого дня</label>
        <select id="generateStartCrew" class="form-select mb-2"></select>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="generateOverwrite">
          <label class="form-check-label" for="generateOverwrite">
            Перезаписать: сначала удалить смены линии с этой даты (кроме закреплённых)
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-dark" id="generateModalSave">Заполнить</button>
      </div>
    </div>
  </div>
</div>

<!-- Crew picker for an empty line shift -->
<div class="modal fade" id="crewShiftModal" tabindex="-1" aria-labelledby="crewShiftModalTitle" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="crewShiftModalTitle">Поставить бригаду</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <p id="crewShiftModalSlot" class="mb-2"></p>
        <label for="crewShiftModalCrew" class="form-label">Бригада</label>
        <select id="crewShiftModalCrew" class="form-select"></select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-dark" id="crewShiftModalSave">Поставить</button>
      </div>
    </div>
  </div>
</div>

<!-- One employee on one crew shift ("По сотрудникам" cell): take off / replace / back / add -->
<div class="modal fade" id="shiftEmployeeModal" tabindex="-1" aria-labelledby="shiftEmployeeModalTitle" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="shiftEmployeeModalTitle">Сотрудник</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <p id="shiftEmployeeModalText" class="mb-2"></p>
        <div id="shiftEmployeeModalSelectGroup">
          <label for="shiftEmployeeModalSelect" class="form-label" id="shiftEmployeeModalSelectLabel">Выбор</label>
          <select id="shiftEmployeeModalSelect" class="form-select"></select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-dark" id="shiftEmployeeModalSave">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<script src="/webjars/jquery/jquery.min.js"></script>
<script src="/webjars/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/webjars/js-joda/dist/js-joda.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
