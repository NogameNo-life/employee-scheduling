########################
# Timefold Solver properties
########################

# The solver runs for 30 seconds. To run for 5 minutes use "5m" and for 2 hours use "2h".
quarkus.timefold.solver.termination.spent-limit=30s

# To change how many solvers to run in parallel
# timefold.solver-manager.parallel-solver-count=4

# Temporary comment this out to detect bugs in your code (lowers performance)
# quarkus.timefold.solver.environment-mode=FULL_ASSERT

# Temporary comment this out to return a feasible solution as soon as possible
# quarkus.timefold.solver.termination.best-score-limit=0hard/*soft

# To see what Timefold is doing, turn on DEBUG or TRACE logging.
quarkus.log.category."ai.timefold.solver".level=INFO
%test.quarkus.log.category."ai.timefold.solver".level=INFO
%prod.quarkus.log.category."ai.timefold.solver".level=INFO

# XML file for power tweaking, defaults to solverConfig.xml (directly under src/main/resources)
# quarkus.timefold.solver-config-xml=org/.../maintenanceScheduleSolverConfig.xml

########################
# Timefold Solver Enterprise properties
########################

# To run increase CPU cores usage per solver
%enterprise.quarkus.timefold.solver.move-thread-count=AUTO

########################
# Native build properties
########################

# Enable Swagger UI also in the native mode
quarkus.swagger-ui.always-include=true

########################
# Test overrides
########################

%test.quarkus.timefold.solver.termination.spent-limit=10s

########################
# Database properties
########################

quarkus.datasource.db-kind=mssql
# quarkus.datasource.jdbc.url=jdbc:sqlserver://<host>:1433;databaseName=<db>;encrypt=false
# quarkus.datasource.username=<user>
# quarkus.datasource.password=<password>

# Second datasource: tabu2 (piecework DB, employees BD_CARD)
quarkus.datasource.tabu.db-kind=mssql
# quarkus.datasource.tabu.jdbc.url=jdbc:sqlserver://sqlbd1:1433;databaseName=tabu2;encrypt=false
# quarkus.datasource.tabu.username=<user>
# quarkus.datasource.tabu.password=<password>

# Persistence units. Packages match by prefix (subpackages included), so they must not overlap.
quarkus.hibernate-orm.packages=org.acme.employeescheduling.entity.plr
quarkus.hibernate-orm."tabu".datasource=tabu
quarkus.hibernate-orm."tabu".packages=org.acme.employeescheduling.entity.tabu

# The tests don't touch the database: don't start an MSSQL container via Dev Services (needs Docker)
# and keep Hibernate ORM inactive since no datasource URL is configured.
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.tabu.devservices.enabled=false
%test.quarkus.hibernate-orm.active=false
%test.quarkus.hibernate-orm."tabu".active=false
