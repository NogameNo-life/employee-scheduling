spring.application.name=employee-scheduling

########################
# Environment
########################

# Values come from environment variables (Docker: env_file in docker-compose.yaml).
# For local runs Spring also reads them from .env in the working directory (KEY=value lines).
spring.config.import=optional:file:.env[.properties]

server.port=${HTTP_PORT:8080}

########################
# Database properties
########################

# Main datasource (MES): PLR_* tables, see MesDataSourceConfig
app.datasource.mes.jdbc-url=${MES_DB_URL}
app.datasource.mes.username=${MES_DB_USERNAME}
app.datasource.mes.password=${MES_DB_PASSWORD}
app.datasource.mes.pool-name=mes

# Second datasource (TABU2): employees BD_CARD, see TabuDataSourceConfig.
# TABU2 runs SQL Server 2012 and only supports TLS 1.0: the JVM needs
# -Djava.security.properties=src/main/jvm/legacy-tls.security (spring-boot:run and the Dockerfile add it).
# If it is not reachable, CrewDataLoader logs a warning and uses personnel numbers instead.
app.datasource.tabu.jdbc-url=${TABU2_DB_URL}
app.datasource.tabu.username=${TABU2_DB_USERNAME}
app.datasource.tabu.password=${TABU2_DB_PASSWORD}
app.datasource.tabu.pool-name=tabu

# Hibernate settings for both datasources. Hibernate never changes the database schema (no hbm2ddl).
# The dialect is set, so the application also starts when a database is not reachable.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
# SQL logging: see application-local.properties (-Dspring-boot.run.profiles=local or SPRING_PROFILES_ACTIVE=local)

########################
# HTTP / CORS
########################

# Allowed frontend origins, comma separated. Empty: no CORS.
app.cors.origins=${CORS_ORIGIN:}

# Swagger UI at /swagger-ui.html, OpenAPI at /v3/api-docs
